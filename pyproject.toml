[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "C90", "UP", "B", "S", "FURB", "RUF"]

[tool.ruff.lint.per-file-ignores]
# В init-модулях допустимы неиспользуемые импорты
"__init__.py" = ["F401"]
# assert в тестах это норма pytest
"tests/**" = ["S101"]

[tool.coverage.run]
source = ["gendiff"]
omit = ["*/scripts/*"]

[tool.coverage.report]
fail_under = 80
